version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: customer_db
    environment:
      POSTGRES_DB: customer_db
      POSTGRES_USER: customer_admin
      POSTGRES_PASSWORD: secure_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - customer_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customer_admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Flask Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: customer_api
    environment:
      DATABASE_URL: postgresql://customer_admin:secure_password@postgres:5432/customer_db
      JWT_SECRET_KEY: your-super-secret-key-change-in-production
      FLASK_ENV: development
      FLASK_DEBUG: True
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - customer_network
    command: python app.py

  # React Frontend (Vite)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000/api
    container_name: customer_app
    ports:
      - "3003:3003"
    depends_on:
      - backend
    networks:
      - customer_network

volumes:
  postgres_data:
    driver: local

networks:
  customer_network:
    driver: bridge
